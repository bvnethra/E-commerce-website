<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradHome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fee7" />
      <stop offset="100%" stop-color="#ecfccb" />
    </linearGradient>
    <linearGradient id="vaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="shadowHome" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3f6212" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGradHome)" />

  <g filter="url(#shadowHome)" transform="translate(200, 200)">
    <!-- Plant Leaves -->
    <path d="M0,-20 Q-40,-60 -50,-110 Q-10,-90 0,-20 Z" fill="url(#leafGrad)" />
    <path d="M0,-20 Q40,-60 50,-110 Q10,-90 0,-20 Z" fill="url(#leafGrad)" />
    <path d="M0,-20 Q0,-80 0,-130 Q15,-95 0,-20 Z" fill="#86efac" />

    <!-- Ceramic Vase -->
    <path d="M-25,-20 C-45,10 -55,40 -35,70 C-20,85 20,85 35,70 C55,40 45,10 25,-20 Z" fill="url(#vaseGrad)" />
    
    <!-- Vase Highlight -->
    <path d="M-15,-10 C-30,15 -35,35 -20,60" stroke="#f7fee7" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round" />
  </g>
</svg>
