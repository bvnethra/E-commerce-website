<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>
    <linearGradient id="lampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#854d0e" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGradLight)" />

  <!-- Lamp Soft Light Glow -->
  <circle cx="200" cy="180" r="90" fill="url(#glow)" />

  <g filter="url(#shadowLight)" transform="translate(200, 200)">
    <!-- Base -->
    <ellipse cx="0" cy="65" rx="45" ry="12" fill="url(#lampGrad)" />

    <!-- Stem Arm -->
    <path d="M0,65 Q30,10 -10,-20" fill="none" stroke="url(#lampGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Lamp Shade -->
    <path d="M-40,-20 L20,-20 L35,-65 L-55,-65 Z" fill="url(#lampGrad)" />
    
    <!-- Bulb Glow core -->
    <ellipse cx="-10" cy="-15" rx="15" ry="8" fill="#ffffff" />
  </g>
</svg>
