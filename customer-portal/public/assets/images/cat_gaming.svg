<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradGame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadowGame" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGradGame)" />

  <g filter="url(#shadowGame)" transform="translate(200, 200)">
    <!-- Gamepad Body -->
    <path d="M-65,-30 C-65,-50 -30,-50 0,-35 C30,-50 65,-50 65,-30 C75,-10 80,45 50,55 C35,60 20,40 0,35 C-20,40 -35,60 -50,55 C-80,45 -75,-10 -65,-30 Z" fill="url(#padGrad)" />

    <!-- D-Pad -->
    <path d="M-40,-15 L-30,-15 L-30,-25 L-20,-25 L-20,-15 L-10,-15 L-10,-5 L-20,-5 L-20,5 L-30,5 L-30,-5 L-40,-5 Z" fill="#94a3b8" />

    <!-- Action Buttons -->
    <circle cx="35" cy="-20" r="5" fill="#ef4444" />
    <circle cx="45" cy="-10" r="5" fill="#3b82f6" />
    <circle cx="25" cy="-10" r="5" fill="#eab308" />
    <circle cx="35" cy="0" r="5" fill="#22c55e" />

    <!-- Thumbsticks -->
    <circle cx="-20" cy="15" r="12" fill="#334155" stroke="#64748b" stroke-width="3" />
    <circle cx="20" cy="15" r="12" fill="#334155" stroke="#64748b" stroke-width="3" />
  </g>
</svg>
