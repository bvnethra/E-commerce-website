<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSmart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadowSmart" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGradSmart)" />

  <g filter="url(#shadowSmart)" transform="translate(200, 200)">
    <!-- Smart Hub Base Ring -->
    <circle cx="0" cy="0" r="70" fill="url(#hubGrad)" />
    <circle cx="0" cy="0" r="50" fill="#0f172a" />
    
    <!-- Smart House Icon inside screen -->
    <path d="M-20,10 L0,-15 L20,10 L15,10 L15,25 L-15,25 L-15,10 Z" fill="#38bdf8" />
    
    <!-- Wi-Fi Signals -->
    <path d="M-30,-25 A 35 35 0 0 1 30,-25" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <path d="M-20,-35 A 45 45 0 0 1 20,-35" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
