<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9f1239" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  
  <g filter="url(#shadow)" transform="translate(200, 200)">
    <!-- Ring Base -->
    <ellipse cx="0" cy="20" rx="65" ry="45" fill="none" stroke="url(#goldGrad)" stroke-width="22" />
    <ellipse cx="0" cy="20" rx="65" ry="45" fill="none" stroke="#fef08a" stroke-width="4" opacity="0.6" />
    
    <!-- Diamond Gem -->
    <path d="M-30,-35 L0,-75 L30,-35 L0,-15 Z" fill="url(#gemGrad)" />
    <path d="M-30,-35 L0,-30 L30,-35 L0,-75 Z" fill="#7dd3fc" opacity="0.5" />
    <path d="M0,-75 L0,-15" stroke="#ffffff" stroke-width="2" opacity="0.6" />
    
    <!-- Setting Claws -->
    <circle cx="-25" cy="-30" r="5" fill="url(#goldGrad)" />
    <circle cx="25" cy="-30" r="5" fill="url(#goldGrad)" />
    <circle cx="0" cy="-15" r="5" fill="url(#goldGrad)" />
  </g>
</svg>
