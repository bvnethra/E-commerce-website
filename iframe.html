<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopSphere Data Bridge</title>
  <script>
    // Listen for data query messages from the Admin Portal (localhost:8001)
    window.addEventListener('message', (event) => {
      // Security check: Only allow localhost origins to prevent external script injection
      if (!event.origin.startsWith('http://localhost:')) return;

      const { action, key, value } = event.data;
      const port = event.ports[0];
      if (!port) return;

      try {
        if (action === 'get') {
          const data = localStorage.getItem(key);
          port.postMessage({ value: data });
        } else if (action === 'set') {
          localStorage.setItem(key, value);
          port.postMessage({ success: true });
        } else if (action === 'remove') {
          localStorage.removeItem(key);
          port.postMessage({ success: true });
        }
      } catch (err) {
        port.postMessage({ error: err.message });
      }
    });
  </script>
</head>
<body>
  <!-- Clean, invisible bridge page -->
</body>
</html>
