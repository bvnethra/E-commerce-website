<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="towelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="towelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadowBed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#075985" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGradBed)" />

  <g filter="url(#shadowBed)" transform="translate(200, 200)">
    <!-- Bottom Folded Towel -->
    <rect x="-70" y="20" width="140" height="40" rx="12" fill="url(#towelGrad1)" />
    <path d="M-60,40 L50,40" stroke="#f0f9ff" stroke-width="3" opacity="0.5" stroke-linecap="round" />

    <!-- Middle Folded Towel -->
    <rect x="-60" y="-25" width="120" height="38" rx="10" fill="url(#towelGrad2)" />
    <path d="M-50,-5 L40,-5" stroke="#f0f9ff" stroke-width="3" opacity="0.5" stroke-linecap="round" />

    <!-- Top Folded Towel -->
    <rect x="-50" y="-65" width="100" height="35" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3" />
    <path d="M-40,-48 L30,-48" stroke="#38bdf8" stroke-width="2" opacity="0.7" stroke-linecap="round" />
  </g>
</svg>
