<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFrag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#fae8ff" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadowFrag" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#581c87" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGradFrag)" />

  <g filter="url(#shadowFrag)" transform="translate(200, 200)">
    <!-- Perfume Bottle -->
    <rect x="-45" y="-30" width="90" height="100" rx="16" fill="url(#bottleGrad)" />
    
    <!-- Bottle Neck -->
    <rect x="-15" y="-50" width="30" height="20" rx="4" fill="url(#capGrad)" />
    
    <!-- Spray Cap -->
    <rect x="-25" y="-75" width="50" height="25" rx="6" fill="url(#capGrad)" />
    
    <!-- Label -->
    <rect x="-25" y="-5" width="50" height="40" rx="6" fill="#fdf4ff" opacity="0.9" />
    <line x1="-15" y1="10" x2="15" y2="10" stroke="#9333ea" stroke-width="3" stroke-linecap="round" />
    <line x1="-10" y1="20" x2="10" y2="20" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
