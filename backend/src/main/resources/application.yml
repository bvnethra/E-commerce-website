spring:
  application:
    name: aura-ecommerce-backend
  
  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/aura_ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: password # Replace with your local MySQL password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA & Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Security & JWT Configuration
app:
  jwt:
    # Base64 encoded secret key (minimum 256 bits). Represents "AuraEcommerceWebApplicationJWTSecretSigningKey2026TokenVerification"
    secret: QXVyYUVjb21tZXJjZVdlYkFwcGxpY2F0aW9uSldUU2VjcmV0U2lnbmluZ0tleTIwMjZUb2tlblZlcmlmaWNhdGlvbg==
    expirationMs: 86400000 # 24 Hours in milliseconds

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
